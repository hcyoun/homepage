<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 생성 — 툴박스</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/password.css">
  <script>try { const t = localStorage.getItem("tb-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body data-page="password">
  <header id="site-header"></header>

  <main class="container">
    <div class="page-head">
      <h1>🔐 비밀번호 생성</h1>
      <p>브라우저의 암호학적 난수(<code>crypto.getRandomValues</code>)로 만듭니다. 생성된 값은 어디에도 전송·저장되지 않아요.</p>
    </div>

    <div class="pw-layout">
      <section class="panel pw-main">
        <div class="pw-output">
          <output id="pw" class="pw-text" aria-live="polite"></output>
          <div class="pw-actions">
            <button class="icon-btn" id="regen" title="다시 만들기" aria-label="다시 만들기">↻</button>
            <button class="btn btn-primary" id="copy">복사</button>
          </div>
        </div>
        <div class="strength">
          <div class="meter"><span id="meter-bar"></span></div>
          <span id="strength-label"></span>
        </div>
      </section>

      <section class="panel pw-options">
        <div class="opt-row">
          <label class="label" for="length">길이 <strong id="length-value">16</strong>자</label>
          <input type="range" id="length" min="4" max="64" value="16">
        </div>
        <div class="checks">
          <label><input type="checkbox" id="upper" checked> 대문자 (A–Z)</label>
          <label><input type="checkbox" id="lower" checked> 소문자 (a–z)</label>
          <label><input type="checkbox" id="digits" checked> 숫자 (0–9)</label>
          <label><input type="checkbox" id="symbols" checked> 기호 (!@#$…)</label>
          <label><input type="checkbox" id="no-ambiguous"> 헷갈리는 문자 제외 (0 O o l 1 I)</label>
        </div>
        <div class="opt-row">
          <span class="label">여러 개 만들기</span>
          <div class="bulk">
            <button class="btn" data-bulk="5">5개</button>
            <button class="btn" data-bulk="10">10개</button>
          </div>
        </div>
        <ul class="bulk-list" id="bulk-list"></ul>
      </section>
    </div>
  </main>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/password.js"></script>
</body>
</html>
