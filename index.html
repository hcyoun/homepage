<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>툴박스 — 브라우저에서 바로 쓰는 작은 도구들</title>
  <meta name="description" content="계산기, 노트, 타이머, 단위 변환, 비밀번호 생성기를 설치 없이 브라우저에서 바로 사용하세요.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <script>try { const t = localStorage.getItem("tb-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body data-page="home">
  <header id="site-header"></header>

  <main class="container">
    <section class="hero">
      <span class="hero-badge">설치 없음 · 로그인 없음 · 서버 전송 없음</span>
      <h1>매일 쓰는 작은 도구,<br><span class="grad">한 곳에 모았어요.</span></h1>
      <p>필요한 도구를 위 메뉴나 아래 카드에서 골라 보세요. 모든 데이터는 지금 쓰는 브라우저에만 저장됩니다.</p>
    </section>

    <section class="tool-grid" id="tool-grid" aria-label="도구 목록"></section>

    <section class="tips panel">
      <h2>💡 알아두면 좋은 점</h2>
      <ul>
        <li><strong>계산기</strong>는 키보드 숫자와 <kbd>Enter</kbd>, <kbd>Backspace</kbd>, <kbd>Esc</kbd>를 지원합니다.</li>
        <li><strong>노트</strong>는 입력하는 즉시 자동 저장됩니다. 브라우저 데이터를 지우면 함께 사라져요.</li>
        <li>오른쪽 위 버튼으로 <strong>다크 모드</strong>를 켜고 끌 수 있습니다.</li>
      </ul>
    </section>
  </main>

  <script src="assets/js/common.js"></script>
  <script>
    document.getElementById("tool-grid").innerHTML = TOOLS.map((t) => `
      <a class="tool-card panel" href="${t.href}">
        <span class="tool-icon">${t.icon}</span>
        <h3>${t.name}</h3>
        <p>${t.desc}</p>
        <span class="tool-go">열기 →</span>
      </a>`).join("");
  </script>
</body>
</html>
