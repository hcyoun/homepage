[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "driftwatch"
dynamic = ["version"]
description = "Detect configuration drift between environments before it reaches production."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "윤희창" }]
keywords = ["config", "drift", "devops", "ci", "diff"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
driftwatch = "driftwatch.cli:main"

[project.urls]
Homepage = "https://hcyoun.github.io/homepage/"
Source = "https://github.com/hcyoun/homepage"

[tool.hatch.version]
path = "src/driftwatch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/driftwatch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
